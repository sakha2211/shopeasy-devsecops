apiVersion: v1
kind: Service
metadata:
  name: shopeasy-service
  namespace: shopeasy
  labels:
    app: shopeasy-app
spec:
  type: NodePort
  selector:
    app: shopeasy-app
  ports:
    - name: http
      protocol: TCP
      port: 80          # Cluster Internal Port
      targetPort: 3000  # Container Application Port
      nodePort: 30080   # Host External Port (NodePort range 30000-32767)