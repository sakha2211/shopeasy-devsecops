apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopeasy-deployment
  namespace: shopeasy
  labels:
    app: shopeasy-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shopeasy-app
  template:
    metadata:
      labels:
        app: shopeasy-app
    spec:
      containers:
        - name: shopeasy-container
          image: DOCKER_HUB_USER/shopeasy-microservice:BUILD_NUMBER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          
          # Container Resource Management (Defends against CPU/RAM Exhaustion)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          # Liveness Probe: Restarts pod if app deadlocks/crashes
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # Readiness Probe: Prevents routing traffic until app is ready
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2