apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopeasy-ingress
  namespace: shopeasy
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: shopeasy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopeasy-service
                port:
                  number: 80