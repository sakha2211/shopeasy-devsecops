# Unique identifier for this project in SonarQube
sonar.projectKey=shopeasy-microservice
sonar.projectName=ShopEasy Microservice

# Project version
sonar.projectVersion=1.0.0

# Path to application source code (relative to project root)
sonar.sources=.

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Files/Directories to exclude from scanning to avoid false positives and noise
sonar.exclusions=node_modules/**, coverage/**, postman/**, k8s/**, k6/**, *.html, *.json

# Specify programming language environment
sonar.language=js